services:
  web:
    image: nginx:latest
    container_name: webserver
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro

    depends_on:
      - database

  database:
    image: mariadb:latest
    container_name: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: geheim
      MARIADB_DATABASE: webseite
      MARIADB_USER: webuser
      MARIADB_PASSWORD: passwort

    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PMA_HOST: database

    depends_on:
      - database

volumes:
  db_data:
